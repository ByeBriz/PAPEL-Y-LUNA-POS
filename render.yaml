databases:
  - name: papel-y-luna-db
    databaseName: papelyluna
    user: papelyluna_user
    plan: free

services:
  - type: web
    name: papel-y-luna-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: papel-y-luna-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: DJANGO_ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: DJANGO_CASHIER_INITIAL_PASSWORD
        generateValue: true
      - key: DJANGO_AUTHORS_JSON
        value: '[{"nombre":"Juan Carlos Gutierrez","codigo":"357663"}]'
