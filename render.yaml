databases:
  - name: papel-y-luna-db
    databaseName: papelyluna
    user: papelyluna_user
    plan: free

services:
  - type: web
    name: papel-y-luna-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: papel-y-luna-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://papel-y-luna-app-20261117.onrender.com"
      - key: DJANGO_ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: DJANGO_CASHIER_INITIAL_PASSWORD
        generateValue: true
      - key: DJANGO_AUTHORS_JSON
        value: '[{"nombre":"Juan Carlos Gutierrez","codigo":"357663"}]'

  - type: web
    runtime: static
    name: papel-y-luna-app-20261117
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: "https://papel-y-luna-backend-duov.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
